# 프로젝트 이름을 고정한다 — 비워 두면 폴더 이름이 프로젝트가 되어, 다른 폴더(worktree)에서 db:up 하면
# 고정된 container_name 이 "다른 프로젝트 소속" 으로 충돌한다. 아래 볼륨 이름 고정과 한 쌍이다.
name: idaeri

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: idaeri-postgres
    restart: unless-stopped
    # 자격증명은 .env 에서 interpolation. GitGuardian 등 정적 분석에 하드코딩 credential 을 남기지 않기 위함.
    # 바꾸고 싶을 땐 .env 의 POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB 와 DATABASE_URL 을 **함께** 갱신해야 한다.
    # 호스트 포트는 로컬에 이미 떠 있는 다른 프로젝트 Postgres (5432/5433) 와 충돌하지 않도록 5434 로 분리한다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 가 .env 에 없음}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없음}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 가 .env 에 없음}
    # 127.0.0.1 에만 연다 — 앱은 같은 맥에서 붙고, 원장에는 리뷰 결과·업무 기록이 쌓여 같은 망(카페 와이파이 등)에 열어 둘 이유가 없다.
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - idaeri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idaeri-redis
    restart: unless-stopped
    # 호스트 포트는 로컬에 이미 떠 있는 다른 프로젝트 Redis (6379/6380) 와 충돌하지 않도록 6381 로 분리한다.
    # Redis 는 인증이 없어 같은 망에 열리면 큐(BullMQ job 페이로드)를 누구나 읽고 쓴다 — 127.0.0.1 에만 연다.
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - idaeri_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

# 볼륨 실제 이름을 고정한다. 이름을 비워 두면 compose 가 "명령을 친 폴더(프로젝트) 이름" 을 앞에 붙여,
# worktree 에서 db:up 하면 빈 새 볼륨이 생겨 데이터가 사라진 것처럼 보인다(2026-06-22 실제로 빈 DB 로
# 갈아탔다). 값은 그때부터 쓰고 있는 볼륨 이름 그대로 — 데이터 이전 없이 고정만 한다.
volumes:
  idaeri_postgres_data:
    name: featepisodic-memory_idaeri_postgres_data
  idaeri_redis_data:
    name: personal_agents_idaeri_redis_data
