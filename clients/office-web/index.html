<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>이대리 오피스</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #17151a;
        color: #cfc9d4;
        font: 13px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 12px;
        box-sizing: border-box;
      }
      canvas {
        /* 도트 그림이라 확대·축소에서 뭉개지면 안 된다. */
        image-rendering: pixelated;
        background: #0d0c0f;
      }
      #status {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #status.error {
        color: #ff8f7a;
      }
      /* 맥 앱 안(`?hosted=1`) — 앱에 머리줄이 있어 여백·상태 줄을 뺀다. 오류만은 위에 띄운다. */
      body.hosted {
        padding: 0;
        gap: 0;
      }
      body.hosted #status {
        display: none;
      }
      body.hosted #status.error {
        display: block;
        position: fixed;
        bottom: 8px;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(23, 21, 26, 0.85);
      }
    </style>
  </head>
  <body>
    <canvas id="office"></canvas>
    <div id="status">평면도를 읽는 중…</div>
    <!-- 번들러가 없어 import map 으로 three.js 를 동봉본에 잇는다(`scripts-vendor-three.mjs`). -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <script type="module" src="live.js"></script>
  </body>
</html>
